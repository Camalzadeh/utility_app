name: utility_app
description: "A comprehensive, feature-rich Utility Android Application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management & DI
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.0

  # Local Structured Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Networking & Scraping
  dio: ^5.4.0
  http: ^1.2.0
  html: ^0.15.4

  # Media Downloader & Playback
  youtube_explode_dart: ^2.3.1
  video_player: ^2.8.2
  chewie: ^1.8.1

  # Background Workers & Alarm
  workmanager: ^0.5.2

  # Device & System Utilities
  path_provider: ^2.1.2
  permission_handler: ^11.3.0
  url_launcher: ^6.2.5
  shared_preferences: ^2.2.2

  # Design & Styling
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
